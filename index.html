<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#45456e">
<title>Kryželio raštų kūrėjas</title>
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<main class="desk">
  <header class="bar">
    <button class="btn" id="libbtn" aria-haspopup="dialog"><i data-icon="library"></i><span data-i18n="library"></span></button>
    <input id="title" data-i18n-attr="aria-label:patternTitle" maxlength="120" autocomplete="off">
    <span class="muted" id="dims"></span>
    <span class="savestate" id="savestate" aria-live="polite"></span>
    <button class="btn" id="sharebtn" aria-haspopup="dialog"><i data-icon="share"></i><span data-i18n="share"></span></button>
    <button class="btn icon" id="helpbtn" data-i18n-attr="aria-label:help;title:help" aria-haspopup="dialog" aria-keyshortcuts="?"><i data-icon="help"></i></button>
  </header>

  <div class="toolbar" role="toolbar" data-i18n-attr="aria-label:tools">
    <div class="seg" id="tools" role="group" data-i18n-attr="aria-label:tool">
      <button class="btn tbtn" data-tool="pen" aria-keyshortcuts="B"><i data-icon="pen"></i><span data-i18n="pen"></span><kbd>B</kbd></button>
      <button class="btn tbtn" data-tool="erase" aria-keyshortcuts="E"><i data-icon="erase"></i><span data-i18n="erase"></span><kbd>E</kbd></button>
      <button class="btn tbtn" data-tool="fill" aria-keyshortcuts="G"><i data-icon="fill"></i><span data-i18n="fill"></span><kbd>G</kbd></button>
      <button class="btn tbtn" data-tool="pick" aria-keyshortcuts="I"><i data-icon="pick"></i><span data-i18n="pick"></span><kbd>I</kbd></button>
    </div>
    <button class="btn chip" id="curcolor" type="button"><span class="chipsw"></span></button>
    <div class="seg" id="mirror" role="group" data-i18n-attr="aria-label:mirror">
      <button class="btn tbtn ic" data-m="none" data-i18n-attr="aria-label:mirrorNone;title:mirrorNone"><i data-icon="mirrorNone"></i></button>
      <button class="btn tbtn ic" data-m="h" data-i18n-attr="aria-label:mirrorH;title:mirrorH"><i data-icon="mirrorH"></i></button>
      <button class="btn tbtn ic" data-m="v" data-i18n-attr="aria-label:mirrorV;title:mirrorV"><i data-icon="mirrorV"></i></button>
      <button class="btn tbtn ic" data-m="both" data-i18n-attr="aria-label:mirrorBoth;title:mirrorBoth"><i data-icon="mirrorBoth"></i></button>
    </div>
    <div class="seg" role="group" data-i18n-attr="aria-label:history">
      <button class="btn tbtn ic" id="undo" aria-keyshortcuts="Control+Z" data-i18n-attr="aria-label:undo"><i data-icon="undo"></i></button>
      <button class="btn tbtn ic" id="redo" aria-keyshortcuts="Control+Shift+Z" data-i18n-attr="aria-label:redo"><i data-icon="redo"></i></button>
    </div>
    <div class="seg zoom" role="group" data-i18n-attr="aria-label:zoom">
      <button class="btn tbtn ic" id="zout" aria-keyshortcuts="-" data-i18n-attr="aria-label:zoomOut;title:zoomOut"><i data-icon="zoomOut"></i></button>
      <button class="btn tbtn ic" id="zfit" aria-keyshortcuts="0" data-i18n-attr="aria-label:zoomFit;title:zoomFit"><i data-icon="fit"></i></button>
      <button class="btn tbtn ic" id="zin" aria-keyshortcuts="+" data-i18n-attr="aria-label:zoomIn;title:zoomIn"><i data-icon="zoomIn"></i></button>
    </div>
  </div>

  <div class="canvaswrap" id="wrap">
    <canvas id="grid" tabindex="0" role="application" data-i18n-attr="aria-label:canvasLabel"></canvas>
  </div>
  <div class="statusbar"><span id="coords" class="coords"></span><span class="muted" data-i18n="hintShort"></span></div>
  <div id="live" class="sr" aria-live="polite"></div>

  <section class="legend" aria-labelledby="legendh">
    <h2 id="legendh" data-i18n="legend"></h2>
    <ul id="legend"></ul>
  </section>
</main>

<aside class="side">
  <div class="top">
    <div>
      <h1 data-i18n="heading"></h1>
      <div class="tagline" data-i18n="tagline"></div>
    </div>
    <label class="lang"><span class="sr" data-i18n="language"></span><select id="lang"></select></label>
  </div>

  <div id="notice" class="notice" role="status" hidden></div>

  <section class="panel">
    <h2><span data-i18n="colors"></span> <span id="pc" class="muted"></span></h2>
    <ul class="pal" id="pal"></ul>
    <div class="row"><button class="btn" id="add" data-i18n="addColor"></button></div>
  </section>

  <section class="panel">
    <h2 data-i18n="print"></h2>
    <label class="sr" for="pmode" data-i18n="print"></label>
    <select id="pmode" class="btn wide">
      <option value="both" data-i18n="modeBoth"></option>
      <option value="sym" data-i18n="modeSym"></option>
      <option value="col" data-i18n="modeCol"></option>
    </select>
    <div class="row">
      <button class="btn primary" id="pdfopen" aria-keyshortcuts="Control+P" data-i18n="openPdf"></button>
      <button class="btn" id="pdfdl" data-i18n="downloadPdf"></button>
    </div>
  </section>

  <details class="panel" id="pattern-panel">
    <summary><h2 data-i18n="pattern"></h2></summary>
    <div class="row">
      <button class="btn" id="new" data-i18n="newPattern"></button>
      <button class="btn" id="save" aria-keyshortcuts="Control+S" data-i18n="save"></button>
      <button class="btn" id="open" aria-keyshortcuts="Control+O" data-i18n="open"></button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
    <div class="row">
      <button class="btn" id="clear" data-i18n="clear"></button>
    </div>
    <h3 data-i18n="size"></h3>
    <form class="fitin" id="sizeform">
      <label><span data-i18n="width"></span><input type="number" id="gw" min="5" max="200" required inputmode="numeric"><span data-i18n="cells"></span></label>
      <label><span data-i18n="height"></span><input type="number" id="gh" min="5" max="200" required inputmode="numeric"><span data-i18n="cells"></span></label>
      <div class="row"><button class="btn" type="submit" data-i18n="applySize"></button></div>
    </form>
  </details>

  <details class="panel" id="fit-panel">
    <summary><h2 data-i18n="fit"></h2></summary>
    <div class="sub2" id="dsize"></div>
    <div class="fitin">
      <label><span data-i18n="fabricW"></span><input type="number" id="fw" min="1" value="50" inputmode="numeric"><span data-i18n="cells"></span></label>
      <label><span data-i18n="fabricH"></span><input type="number" id="fh" min="1" value="50" inputmode="numeric"><span data-i18n="cells"></span></label>
      <label><span data-i18n="minGap"></span><input type="number" id="fg" min="0" value="1" inputmode="numeric"><span data-i18n="cells"></span></label>
    </div>
    <div id="fitout"></div>
  </details>
</aside>

<div id="toast" class="toast" hidden></div>

<dialog id="libdlg" class="wide" aria-labelledby="libh">
  <div class="dhead">
    <div><h2 id="libh" data-i18n="library"></h2><div class="muted small" id="libcount"></div></div>
    <button class="btn icon dclose" data-i18n-attr="aria-label:close"><i data-icon="close"></i></button>
  </div>
  <div class="libtools">
    <input type="search" id="libsearch" data-i18n-attr="placeholder:searchPatterns;aria-label:searchPatterns" autocomplete="off">
    <button class="btn primary" id="libnew" data-i18n="newPattern"></button>
    <button class="btn" id="libopen" data-i18n="open"></button>
  </div>
  <ul class="libgrid" id="libgrid"></ul>
  <p class="muted" id="libempty" hidden data-i18n="noMatches"></p>
</dialog>

<dialog id="sharedlg" aria-labelledby="shareh">
  <div class="dhead">
    <h2 id="shareh" data-i18n="shareTitle"></h2>
    <button class="btn icon dclose" data-i18n-attr="aria-label:close"><i data-icon="close"></i></button>
  </div>
  <p data-i18n="shareInfo"></p>
  <label class="sr" for="sharelink" data-i18n="shareLink"></label>
  <input id="sharelink" class="linkbox" readonly>
  <p class="warnline" id="sharelong" hidden></p>
  <div class="row">
    <button class="btn primary" id="sharecopy" data-i18n="copyLink"></button>
    <button class="btn" id="sharenative" hidden data-i18n="shareNative"></button>
  </div>
</dialog>

<dialog id="help" aria-labelledby="helph">
  <div class="dhead">
    <h2 id="helph" data-i18n="helpTitle"></h2>
    <button class="btn icon dclose" id="helpclose" data-i18n-attr="aria-label:close"><i data-icon="close"></i></button>
  </div>
  <h3 data-i18n="shortcutsTitle"></h3>
  <table class="keys">
    <tr><td><kbd>B</kbd></td><td data-i18n="scPen"></td></tr>
    <tr><td><kbd>E</kbd></td><td data-i18n="scErase"></td></tr>
    <tr><td><kbd>G</kbd></td><td data-i18n="scFill"></td></tr>
    <tr><td><kbd>I</kbd></td><td data-i18n="scPick"></td></tr>
    <tr><td><kbd>M</kbd></td><td data-i18n="scMirror"></td></tr>
    <tr><td><kbd>1</kbd>–<kbd>9</kbd></td><td data-i18n="scColors"></td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd></td><td data-i18n="scUndo"></td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td data-i18n="scSave"></td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>O</kbd></td><td data-i18n="scOpen"></td></tr>
    <tr><td><kbd>Ctrl</kbd>+<kbd>P</kbd></td><td data-i18n="scPrint"></td></tr>
    <tr><td><kbd>+</kbd> <kbd>−</kbd> <kbd>0</kbd></td><td data-i18n="scZoom"></td></tr>
    <tr><td><kbd>?</kbd></td><td data-i18n="scHelp"></td></tr>
  </table>
  <h3 data-i18n="mouseTitle"></h3>
  <ul><li data-i18n="mAlt"></li><li data-i18n="mRight"></li><li data-i18n="mPan"></li><li data-i18n="mZoom"></li></ul>
  <h3 data-i18n="keysTitle"></h3>
  <ul><li data-i18n="kMove"></li><li data-i18n="kDraw"></li></ul>
  <h3 data-i18n="tipsTitle"></h3>
  <ul><li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li></ul>
</dialog>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
